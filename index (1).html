<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skirmish</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9edf1;--ink:#1c2733;--tile:#dccaa4;--tile2:#d5c29b;--wall:#6b7a86;--move:#7fc4a0;--atk:#e2765f;--you:#2f6fb5;--foe:#b8432f;--panel:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b22;--ink:#e3e9ee;--tile:#4a4233;--tile2:#453d2f;--wall:#3d4954;--move:#2d6b4d;--atk:#93392a;--you:#5b9de0;--foe:#e0664f;--panel:#1d2731}}
:root[data-theme="dark"]{--bg:#141b22;--ink:#e3e9ee;--tile:#4a4233;--tile2:#453d2f;--wall:#3d4954;--move:#2d6b4d;--atk:#93392a;--you:#5b9de0;--foe:#e0664f;--panel:#1d2731}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:0 0 4px}
[hidden]{display:none!important}
#status{min-height:2.6em;margin:0 0 6px;font-size:.95rem}
#mods{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;min-height:2.6em}
.chip{display:flex;flex-direction:column;border-radius:8px;padding:5px 12px;font-size:.9rem;font-weight:700;line-height:1.25;box-shadow:0 0 0 1.5px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.4)}
.chip small{font-size:.7rem;font-weight:400;opacity:.92}
#board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--ink);padding:2px;border-radius:6px}
.t{aspect-ratio:1;border:0;padding:0;background:var(--tile);position:relative;font:inherit;cursor:pointer;overflow:hidden}
.t:nth-child(even){background:var(--tile2)}
.t.w{background:var(--wall);cursor:default}
.t.dp{background:#2f6f9c;cursor:default}
.t.sh{background:#86c4dc}
.t.fo{background-image:linear-gradient(rgba(60,140,80,.25),rgba(60,140,80,.25))}
.t.ir{background:var(--atk)}
.t.ig{background:#8d98a2}
.t.ig.ir{background:#8d98a2;box-shadow:inset 0 0 0 4px var(--atk)}
.t.pr{background:#e9b8a6;background:color-mix(in srgb,var(--atk) 42%,var(--tile))}
.t.fr{background-image:linear-gradient(rgba(105,120,140,.42),rgba(105,120,140,.42))}
.t.m{background:var(--move)}
.t.m.pr{box-shadow:inset 0 0 0 4px rgba(226,118,95,.55)}
.t.a{background:var(--atk)}
.t.hl{background:color-mix(in srgb,#4cc38a 55%,var(--tile));box-shadow:inset 0 0 0 4px #2f9e6a}
.t.hl::after{content:"+";position:absolute;top:2px;right:3px;width:16px;height:16px;border-radius:50%;background:#2f9e6a;color:#fff;font-size:.85rem;font-weight:800;line-height:16px;text-align:center;z-index:3;pointer-events:none}
.t:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;z-index:1}
.dec{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.u{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.45),0 0 0 1.5px rgba(255,255,255,.6)}
.u[data-t=K]{border-radius:22%}.u[data-t=R]{border-radius:50% 50% 14% 14%}.u[data-t=C]{border-radius:50% 50% 50% 14%}.u[data-t=P]{border-radius:50% 14% 50% 14%}.u[data-t=E]{border-radius:14% 50% 50% 50%}.u.slow::after{content:"\2193";position:absolute;top:-5px;left:-5px;width:17px;height:17px;border-radius:50%;background:#4a7fd1;color:#fff;font-size:.8rem;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 1.5px #fff}
.u svg{width:90%;height:90%}
.u.done{opacity:.55;filter:saturate(.25) brightness(1.35)}
.u.sel{box-shadow:0 0 0 3px var(--ink)}
.hp{position:absolute;left:14%;right:14%;bottom:2%;height:4px;background:rgba(0,0,0,.4);border-radius:2px}
.hp i{display:block;height:100%;background:#f2f2f2;border-radius:2px}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button.b{font:inherit;padding:10px 14px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;text-align:left}
button.b[aria-pressed=true]{background:var(--you);border-color:var(--you);color:#fff}
button.b:disabled{opacity:.5;cursor:default}
button.b:focus-visible{outline:3px solid var(--you);outline-offset:2px}
button.b small{display:block;font-size:.78rem;opacity:.85}
#pick p{margin:12px 0 4px;font-size:.95rem}
.opts{display:grid;gap:6px}
.key{font-size:.82rem;opacity:.85;margin-top:12px;line-height:1.5}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:2.6rem;margin:10px 0 6px;letter-spacing:.03em}
.hero p{margin:0;opacity:.85}
.discs{display:flex;justify-content:center;gap:12px}
.pv{position:relative;width:48px;height:48px;flex:none}
.discs .pv{width:60px;height:60px}
.menubtns{display:grid;gap:10px;max-width:280px;margin:22px auto}
button.b.big{text-align:center;font-size:1.05rem;padding:14px}
#rules,#prules{font-size:.9rem;line-height:1.55;background:var(--panel);border-radius:8px;padding:8px 16px 14px}
#rules h3,#prules h3{margin:12px 0 2px;font-size:.95rem}
#rules p,#prules p{margin:0}
#prules p,#prules h3{text-align:left}
.hd{display:flex;gap:12px;align-items:center}
.hd h2{margin:0;font-size:1.25rem}
.card{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:16px;margin-top:14px}
.card .pv{width:56px;height:56px}
.ec{line-height:1.5}
.ec strong{display:block;font-size:1.05rem;margin-bottom:6px}
.ec .em{font-size:.9rem}
.card small,.cards small,.opts small{display:block;font-size:.78rem;opacity:.85;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#pu .uc:last-child:nth-child(odd){grid-column:1/-1}
button.b.uc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px}
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:4px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--ink);cursor:pointer;padding:0}
.swb[aria-pressed=true]{border-color:var(--panel);box-shadow:0 0 0 4px var(--ink)}
.swb:focus-visible{outline:3px solid var(--you);outline-offset:4px}
#pick h3{margin:18px 0 6px;font-size:1rem}
#pick h3 small{font-weight:400;opacity:.8}
#pick .go{width:100%;text-align:center;margin-top:20px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.65);display:grid;place-items:center;padding:16px;z-index:10}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:18px;width:min(340px,100%);display:grid;gap:10px;max-height:90vh;overflow:auto;box-sizing:border-box}
.panel h2{margin:0;text-align:center}
.panel p{margin:0;text-align:center}
.badge{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:8px;font-weight:700;box-shadow:0 0 0 2px var(--ink)}
#bw{position:relative}
#fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;font-weight:800;font-size:1.25rem;color:#ff7a66;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px #000;animation:pop 1.1s ease-out forwards;z-index:3;white-space:nowrap}
.pop.miss{color:#ffe08a}
.pop.heal{color:#8dffb0}
.pop.slow{color:#8fc2ff}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
@media (prefers-reduced-motion:reduce){@keyframes pop{0%,100%{opacity:0;transform:translate(-50%,-60%)}15%,80%{opacity:1;transform:translate(-50%,-60%)}}}
#info{min-height:88px;margin-top:10px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-sizing:border-box;font-size:.9rem}
#info.empty{justify-content:center;opacity:.75}
#info .pv{width:46px;height:46px}
.ib{flex:1;min-width:0;line-height:1.4}
.nm{display:flex;justify-content:space-between;gap:8px}
.hpb{height:8px;background:rgba(128,128,128,.35);border-radius:4px;overflow:hidden;margin:4px 0}
.hpb i{display:block;height:100%}
.ib small{display:block;font-size:.78rem;opacity:.88}
.uc2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;text-align:center}
.uc2.on{border-color:var(--you);box-shadow:0 0 0 2px var(--you)}
.uc2 small{display:block;font-size:.78rem;opacity:.85}
.step{display:flex;align-items:center;gap:12px;margin-top:6px}
.step span{min-width:1.2em;font-weight:700}
button.b.sm{padding:2px 12px;font-size:1.15rem;text-align:center}
.grp{margin-top:22px}
#pick .grp h3{margin:0 0 8px;font-size:1.05rem}
.sn{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--ink);color:var(--bg);margin-right:8px;font-size:.85rem}
.hint{font-size:.85rem;opacity:.85;margin:8px 0}
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.72rem;text-align:center;min-width:0;box-sizing:border-box}
.slot .pv{width:38px;height:38px}
.slot small{font-size:.66rem;opacity:.8}
.slot.empty{border-style:dashed;opacity:.65;justify-content:center;min-height:84px}
button.slot{cursor:pointer;border-color:var(--you);box-shadow:0 0 0 1px var(--you)}
button.slot:focus-visible{outline:3px solid var(--you);outline-offset:2px}
#pick .go{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* ---- visual polish ---- */
html,body{background:linear-gradient(rgba(128,128,128,.10),rgba(0,0,0,.10)),var(--bg);background-attachment:fixed;min-height:100%}
.hero h1{background:linear-gradient(90deg,var(--you),var(--foe));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.discs .pv{animation:bob 3.2s ease-in-out infinite}
.discs .pv:nth-child(2){animation-delay:.4s}.discs .pv:nth-child(3){animation-delay:.8s}.discs .pv:nth-child(4){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
button.b{box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .15s}
button.b:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
button.b:not(:disabled):active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
#board{box-shadow:0 8px 22px rgba(0,0,0,.3)}
.t{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.08)}
.t.w{box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.28)}
.t.ig.ir{box-shadow:inset 0 0 0 4px var(--atk)}
.t.m.pr{box-shadow:inset 0 0 0 4px rgba(226,118,95,.55)}
.t:not(.w):hover{filter:brightness(1.07)}
.dec{filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.t.a::after{content:"";position:absolute;inset:6%;border:3px solid rgba(255,255,255,.92);border-radius:50%;z-index:2;pointer-events:none;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(.92);opacity:.65}}
.u::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.25))}
.u.sel{animation:selp 1.4s ease-in-out infinite}
@keyframes selp{50%{box-shadow:0 0 0 5px var(--ink)}}
.u[data-team=w]{outline:2px dashed rgba(255,255,255,.8);outline-offset:1px}
#turn{font-weight:700;padding:5px 12px;border-radius:999px;background:var(--panel)}
.card,.panel,#info,#rules,#prules{box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* ---- depth ---- */
#bw{margin-top:6px}
#board{box-shadow:0 7px 0 rgba(0,0,0,.4),0 16px 26px rgba(0,0,0,.35)}
.t{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.14)}
.t.w{box-shadow:inset 0 4px 0 rgba(255,255,255,.28),inset 0 -7px 0 rgba(0,0,0,.4)}
.u{transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.45),0 7px 6px rgba(0,0,0,.3),0 0 0 1.5px rgba(255,255,255,.6)}
.u.sel{box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 0 3px var(--ink);animation:selp 1.4s ease-in-out infinite}
@keyframes selp{50%{box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 0 5px var(--ink)}}
/* ---- terrain guide ---- */
#tguide .panel{width:min(420px,100%)}
#tguide h3{margin:14px 0 0;font-size:1.3rem;text-align:left}
#tguide #tlist h3:first-child{margin-top:0}
#tlist{display:grid;gap:12px}
.tentry{display:grid;gap:4px;text-align:left;background:rgba(128,128,128,.1);border-radius:10px;padding:12px 14px}
.tentry strong{font-size:1.02rem}
.tentry small{display:block;font-size:.85rem;opacity:.9;line-height:1.45}
.tsws{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tsws .tsw{width:100%;height:auto;aspect-ratio:1}
.hli{display:flex;gap:12px;align-items:center;margin-top:8px}.hli .tsw{width:44px;height:44px;flex:none}.hli b{font-size:.9rem}
.tsw i.plus{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#2f9e6a;color:#fff;font-style:normal;font-weight:800;font-size:.85rem;line-height:16px;text-align:center}
.tsw{position:relative;width:44px;height:44px;flex:none;border-radius:6px;overflow:hidden;background:var(--tile);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 0 rgba(0,0,0,.3)}
.tsw i.rg{position:absolute;inset:6%;border:3px solid rgba(255,255,255,.92);border-radius:50%}
@media (prefers-reduced-motion:reduce){.discs .pv,.t.a::after,.u.sel{animation:none}}
#tinfo{min-height:64px;margin-top:10px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center;box-sizing:border-box;font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#tinfo.empty{justify-content:center;opacity:.75}
#tinfo .tsw{width:48px;height:48px}
#info{margin-top:8px}
.t.ts{outline:2px solid rgba(255,255,255,.85);outline-offset:-3px;filter:brightness(1.1)}
.ctl{margin-top:12px}
.ctl .sp{flex:1}
button.b.pri{background:var(--you);border-color:var(--you);color:#fff;font-weight:700;padding:12px 22px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
button.b.sm2{padding:8px 12px;font-size:.85rem}
#tguide{z-index:12}
/* ---- bottom dock ---- */
.turnrow{display:flex;gap:8px;align-items:stretch;margin-top:12px}
#turn{flex:1;display:flex;align-items:center;min-height:48px;padding:8px 14px;box-sizing:border-box;font-size:1.05rem;font-weight:700;border-radius:8px;background:var(--panel);border:2px solid var(--ink);border-left:8px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.turnrow button.pri{padding:0 24px}
#info,#tinfo,#info.empty,#tinfo.empty{display:block;min-height:98px;margin-top:8px;padding:8px 12px 10px;opacity:1}
.lbl{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;opacity:.65;margin-bottom:6px;font-weight:700}
.pb .row{display:flex;gap:12px;align-items:center}
.ph{opacity:.65;padding:14px 0 6px;text-align:center;font-size:.9rem}
.hprow{display:flex;justify-content:space-between;font-size:.8rem;margin-top:2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.stat{background:rgba(128,128,128,.18);border-radius:6px;padding:2px 8px;font-size:.78rem}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#turn{border-left-width:2px;text-shadow:none}
#info,#tinfo,#info.empty,#tinfo.empty{min-height:74px;margin-top:6px;padding:6px 10px 8px}
.lbl{font-size:.62rem;margin-bottom:3px}
#info .pv{width:38px;height:38px}
#tinfo .tsw{width:40px;height:40px}
.hpb{height:6px;margin:2px 0}
.stats{margin:0 0 2px}
.stat{padding:1px 7px;font-size:.74rem}
.ib{line-height:1.3}
.ib small{font-size:.74rem}
.hprow{font-size:.76rem;margin-top:0}
.ph{padding:8px 0 2px}
/* ---- animation ---- */
.t{overflow:visible}
button.b.pri:disabled{background:#8a939c;border-color:#8a939c;color:#e9edf0;opacity:1;box-shadow:none;transform:none}
.u.mv{animation:slide var(--dur,.3s) ease-out;z-index:6}
.u.sel.mv{animation:slide var(--dur,.3s) ease-out,selp 1.4s ease-in-out infinite}
@keyframes slide{from{transform:translate(var(--dx),calc(var(--dy) - 3px))}to{transform:translate(0,-3px)}}
.u.tpin{animation:pin .35s ease-out;z-index:6}
@keyframes pin{from{transform:translateY(-3px) scale(.2);opacity:0}to{transform:translateY(-3px) scale(1);opacity:1}}
.proj{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,220,120,.9),0 0 0 2px rgba(0,0,0,.4);z-index:4;pointer-events:none}
.proj.big{width:18px;height:18px;background:#3a3a3a;box-shadow:0 0 8px 3px rgba(255,150,60,.9),0 0 0 2px #fff}
.burst{position:absolute;width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 12px rgba(255,120,80,.9);z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.u.mv,.u.sel.mv,.u.tpin{animation:none}}
#pbtns{display:grid;gap:10px}
#defeat{z-index:14}
#defeat h2{color:var(--foe)}
.t.pp::before{content:"\2194";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;color:#222;font-size:.72rem;font-weight:700;display:grid;place-items:center;z-index:3;pointer-events:none}
.t.ch{outline:3px solid #fff;outline-offset:-3px}
.t.pd{outline:3px dashed rgba(255,255,255,.95);outline-offset:-4px}
.t.pd::after{content:attr(data-arrow);position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;z-index:2;pointer-events:none}
.wmap{border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3);background:#d8c99b;margin-top:8px}
.wmap>svg{display:block;width:100%;height:auto}
.wn{cursor:pointer}
.wn:focus-visible circle{stroke:#fff}
#wm{transition:transform .8s ease-in-out;pointer-events:none}
.wp{animation:wpulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wpulse{50%{transform:scale(1.22);opacity:.35}}
#winfo{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:8px 12px 10px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#winfo .bar{margin-top:8px}
@media (prefers-reduced-motion:reduce){.wp{animation:none}#wm{transition:none}}
.banner{position:absolute;left:50%;top:50%;z-index:9;width:90%;text-align:center;font-weight:800;font-size:clamp(1.3rem,6vw,2rem);color:#fff;-webkit-text-stroke:0;text-shadow:0 0 4px #000,0 2px 6px #000,0 0 14px rgba(0,0,0,.8);pointer-events:none;animation:bn 1.5s ease-out forwards}@keyframes bn{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1;transform:translate(-50%,-50%)}55%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pmenu{position:absolute;z-index:8;pointer-events:auto;display:grid;gap:5px;width:140px;padding:7px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.pmenu button{font:inherit;display:grid;text-align:left;padding:5px 10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;line-height:1.25}
.pmenu button:first-child{background:var(--you);border-color:var(--you);color:#fff}
.pmenu button small{font-size:.7rem;opacity:.85}
.pmenu button:disabled{opacity:.5;cursor:default}

// path cost from every tile to the nearest target, respecting walls; leaving a forest costs +1
function distMap(srcs){
  const D=Array.from({length:H},()=>Array(W).fill(99));
  srcs.forEach(p=>D[p.y][p.x]=0);
  for(let ch=true;ch;){
    ch=false;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(solid(x+","+y))continue;
      const c0=1+(FOREST.has(x+","+y)||FORT.has(x+","+y)?1:0);
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||solid(nx+","+ny))continue;
        const cc=c0+(SHALLOW.has(nx+","+ny)?1:0);
        if(D[ny][nx]+cc<D[y][x]){D[y][x]=D[ny][nx]+cc;ch=true}
      }
    }
  }
  return D;
}
// lower is better
function evalTile(u,x,y,D,foes){
  const g={x,y},rg=TYPES[u.t].rg,inR=foes.filter(p=>d(g,p)<=rg&&d(g,p)>=TYPES[u.t].mn);
  const gh={...u,x,y},threat=foes.reduce((s,p)=>s+(d(g,p)<=mvOf(p)+TYPES[p.t].rg?dmgTo(p,gh):0),0),wt=units.filter(w=>w.team==="w").reduce((n,w)=>n+(d(g,w)<=TYPES[w.t].rg?dmgTo(w,gh)*1.5:d(g,w)<=TYPES[w.t].rg+TYPES[w.t].mv?dmgTo(w,gh)*.5:0),0);
  let s=(threat+wt)*0.5+(FOREST.has(x+","+y)?(mods[u.team]==="FT"?-1.5:1.5):0)+(FORT.has(x+","+y)?-2:0)+(SHALLOW.has(x+","+y)?1.5:0); // forests slow the next move, but Forest Tactics likes them
  if(inR.length){
    s-=20+Math.max(...inR.map(p=>10*dmgTo(u,p)/p.hp+(dmgTo(u,p)>=p.hp?10:0)));
    if(rg>1)s-=Math.min(...inR.map(p=>d(g,p)))*0.5; // ranged units fire from max distance
  }else s+=D[y][x];
  return s;
}
function enemyTurn(note=""){
  turn="f";sel=null;mode=null;choice=null;insp=null;info=null;busy=true;units.forEach(u=>{if(u.team==="f")u.moved=u.acted=0});say(note+"Enemy is moving...");render();
  const queue=[...units.filter(u=>u.team==="f"),...units.filter(u=>u.team==="w")];let i=0;
  const g=gid;
  (function step(){
    if(over||g!==gid)return;
    if(i>=queue.length){
      const healed=mods.f==="REST"?rest("f"):0;
      units.forEach(u=>{u.moved=u.acted=0;if(u.team!=="y")delete u.slow});
      turn="y";busy=false;say("Your turn. Select one of your units."+(healed?" Resting enemy units recovered HP.":""));render();notify("Enemy turn ended \u2014 your move");return;
    }
    const u=queue[i++];
    if(!units.includes(u))return step();
    if(u.team==="w"){
      if(Math.random()<.6){ // wander to a random reachable tile; never chases anyone
        const opts=reach(u).map(k=>k.split(",").map(Number));

      }

    let bestS=sc(u.x,u.y),best=[u.x,u.y];

    later(()=>{
      if(g!==gid)return;
      const ts=targets(u).sort((a,b)=>(dmgTo(u,b)>=b.hp)-(dmgTo(u,a)>=a.hp)||a.hp-b.hp);
      const fin=()=>{u.acted=1;if(!checkEnd())render();later(step,500)};
      const hs=healTargets(u).sort((a,b)=>a.hp/TYPES[a.t].hp-b.hp/TYPES[b.t].hp);
      if(hs.length&&(hs[0].hp<=TYPES[hs[0].t].hp-2||!ts.length)){u.acted=1;applyHeal(u,hs[0]);say("Enemy "+NAME[u.t]+" healed an ally.");render();return later(step,600)}

          const c=ts.find(p=>pushable(u,p)&&dmgTo(u,p)<p.hp&&FOREST.has(pushDest(u,p)+"")&&pushDest(u,p)+""!==p.x+","+p.y);

    HOWTO.forEach(t=>mk(box,"b big",t.title,()=>howView(ctx,t)));
    mk(box,"b big","Back",ctx.exit);r.append(box);
  }else{
    r.append(el(`<div class="hcard">${topic.art()}${topic.body()}</div>`));
    const box=el('<div class="menubtns"></div>');
    mk(box,"b big","Back",()=>howView(ctx,null));
    mk(box,"b big",ctx.mainLabel,ctx.exit);r.append(box);
  }
  if(ctx.pause)$("pmain").scrollTop=0;else window.scrollTo(0,0);
  const f=r.querySelector("button");if(f)f.focus({preventScroll:true});
}
const howMain={root:$("rulesview"),mainLabel:"Back to Main Menu",exit:()=>{$("rulesview").hidden=true;$("mbtns").hidden=false;$("how").focus()}};
$("how").onclick=()=>{$("mbtns").hidden=true;$("rulesview").hidden=false;howView(howMain,null)};
$("back").onclick=()=>show("menu");
$("go").onclick=()=>{
  if(campSetup){camp.cfg={x:pick.x.slice(),m:pick.m,c:pick.c};camp.pos=0;camp.cleared=[];camp.done=false;camp.hp=null;camp.sel=0;genWorld();saveCamp();openWorld()}
  else start();
};
$("end").onclick=()=>{
  if(over||busy||locked||!units.length||turn!=="y")return;
  const n=mods.y==="REST"?rest("y"):0;
  units.forEach(u=>{if(u.team==="y")delete u.slow});
  notify("You ended your turn");
  enemyTurn(n?"Your resting units recovered HP. ":"");
};
$("reset").onclick=init;
function buildGuide(){
  const sw=(inner,st="")=>`<div class="tsw" style="${st}">${inner}</div>`;
  const row=(sws,title,desc,cls="")=>`<div class="tentry${cls}"><strong>${title}</strong><small>${desc}</small><div class="tsws">${sws}</div></div>`;
  const grp=(title,items)=>`<div class="tentry"><strong>${title}</strong>${items.map(([st,inner,t,d])=>`<div class="hli">${sw(inner,st)}<div><b>${t}</b><small>${d}</small></div></div>`).join("")}</div>`;
  $("tlist").innerHTML="<h3>Terrain</h3>"
   +row([0,1,2,3].map(v=>sw(ground(3,4,v))).join(""),"Open Ground","No special effect.")
   +row(FOREST_V.map(v=>sw(v,TF)).join(""),"Forest","Leaving a forest costs 1 movement. Attacks into a forest have a 3% chance to miss.")
   +row(SH_V.map(v=>sw(v,"background:#86c4dc")).join(""),"Shallow Water","Entering it costs 1 extra movement. Often found around deep water, and sometimes as a ford across a river.")
   +row(DP_V.map(v=>sw(v,"background:#2f6f9c")).join(""),"Deep Water","Impassable. Units can't enter or cross it, but attacks can pass over it. Forms lakes, ponds and rivers.")
   +row(WALL_V.map(v=>sw(v,"background:var(--wall)")).join(""),"Wall","Impassable. Units can't enter or cross it, but attacks can pass over it.")
   +row(FORT_V.map(v=>sw(v,FR)).join(""),"Fortress","Uncommon. A unit standing on one takes 1 less damage from all attacks, and leaving costs 1 movement.")
   +"<h3>Highlights</h3>"
   +grp("Allies",[["background:var(--move)","","Green","Where your selected unit can move."],["background:color-mix(in srgb,#4cc38a 55%,var(--tile));box-shadow:inset 0 0 0 4px #2f9e6a",'<i class="plus">+</i>',"Green Border With a Plus","An ally your selected healer can heal right now."]])
   +grp("Enemies",[["background:#e9b8a6;background:color-mix(in srgb,var(--atk) 42%,var(--tile))","","Pale Red","Everything your selected unit could hit after moving."],["background:var(--atk)",'<i class="rg"></i>',"Red Ring","An enemy you can attack right now."],["background:#8d98a2","","Gray","Where a tapped enemy can move."],["background:#8d98a2;box-shadow:inset 0 0 0 4px var(--atk)","","Gray With a Red Border","Tiles an enemy can both move to and attack."]]);
}
const closeGuide=()=>{$("tguide").hidden=true};
$("pguide").onclick=()=>{buildGuide();$("tguide").hidden=false;$("tclose").focus()};
$("tclose").onclick=closeGuide;
if(document.addEventListener)document.addEventListener("keydown",e=>{if(e.key==="Escape")closeGuide()});
const closePause=()=>{paused=false;$("pause").hidden=true};
const panel=n=>["pmain","pconfirm","pover"].forEach(p=>$(p).hidden=p!==n);
const resetPause=()=>{$("pbtns").hidden=false;$("prules").hidden=true;$("ptitle").hidden=false;$("ptitle").textContent="Paused"};
$("dagain").onclick=()=>{
  $("defeat").hidden=true;
  if(endMode==="quick")init();
  else if(endMode==="cwin"){camp.battle=null;openWorld()}
  else beginBattle(WORLD[camp.battle.node]);
};
$("dmenu").onclick=()=>{
  gid++;$("defeat").hidden=true;
  const toMap=endMode==="close";camp.battle=null;
  if(toMap)openWorld();else show("menu");
};
$("tomenu").onclick=()=>{paused=true;resetPause();panel("pmain");$("pause").hidden=false;$("pback").focus()};
$("pback").onclick=closePause;
const howPause={root:$("prules"),mainLabel:"Back to Pause Menu",pause:true,exit:()=>{resetPause();$("prule").focus()}};
$("prule").onclick=()=>{$("pbtns").hidden=true;$("prules").hidden=false;$("ptitle").hidden=true;howView(howPause,null)};
$("pconcede").onclick=()=>{panel("pconfirm");$("pno").focus()};
$("pno").onclick=()=>{panel("pmain");$("pback").focus()};
$("pyes").onclick=()=>{
  gid++;over=true;busy=false;panel("pover");
  setTimeout(()=>{closePause();resetPause();if(camp.battle){camp.battle=null;openWorld()}else show("menu")},1800);
};
pick={x:[],m:null,c:"blue"};show("menu");
</script>
</body>
</html>
