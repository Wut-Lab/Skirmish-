<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skirmish</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9edf1;--ink:#1c2733;--tile:#dccaa4;--tile2:#d5c29b;--wall:#6b7a86;--move:#7fc4a0;--atk:#e2765f;--you:#2f6fb5;--foe:#b8432f;--panel:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b22;--ink:#e3e9ee;--tile:#4a4233;--tile2:#453d2f;--wall:#3d4954;--move:#2d6b4d;--atk:#93392a;--you:#5b9de0;--foe:#e0664f;--panel:#1d2731}}
:root[data-theme="dark"]{--bg:#141b22;--ink:#e3e9ee;--tile:#4a4233;--tile2:#453d2f;--wall:#3d4954;--move:#2d6b4d;--atk:#93392a;--you:#5b9de0;--foe:#e0664f;--panel:#1d2731}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:1.4rem;margin:0 0 4px}
[hidden]{display:none!important}
#status{min-height:2.6em;margin:0 0 6px;font-size:.95rem}
#mods{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;min-height:2.6em}
.chip{display:flex;flex-direction:column;border-radius:8px;padding:5px 12px;font-size:.9rem;font-weight:700;line-height:1.25;box-shadow:0 0 0 1.5px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.4)}
.chip small{font-size:.7rem;font-weight:400;opacity:.92}
.t:nth-child(even){background:var(--tile2)}
.t.dp{background:#2f6f9c;cursor:default}
.t.brl{cursor:pointer}
.t.sh{background:#86c4dc}
.t.fo{background-image:linear-gradient(rgba(60,140,80,.25),rgba(60,140,80,.25))}
.t.ir{background:var(--atk)}
.t.ig{background:#8d98a2}
.t.pr{background:color-mix(in srgb,var(--atk) 42%,var(--tile))}
.t.fr{background-image:linear-gradient(rgba(105,120,140,.42),rgba(105,120,140,.42))}
.t.m{background:var(--move)}
.t.a{background:var(--atk)}
.t.hl{background:color-mix(in srgb,#4cc38a 55%,var(--tile));box-shadow:inset 0 0 0 4px #2f9e6a}
.t.hl::after{content:"+";position:absolute;top:2px;right:3px;width:16px;height:16px;border-radius:50%;background:#2f9e6a;color:#fff;font-size:.85rem;font-weight:800;line-height:16px;text-align:center;z-index:3;pointer-events:none}
.t:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;z-index:1}
.u[data-t=K]{border-radius:22%}
.u[data-t=R]{border-radius:50% 50% 14% 14%}
.u[data-t=C]{border-radius:50% 50% 50% 14%}
.u[data-t=P]{border-radius:50% 14% 50% 14%}
.u[data-t=E]{border-radius:14% 50% 50% 50%}
.u[data-t=T]{border-radius:22% 22% 50% 50%}
.u[data-t=N]{border-radius:14% 50% 14% 50%}
.u[data-t=M]{inset:19%;border-radius:40%}
.u.insp::before{content:"+1";position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 2px;border-radius:8px;background:#e0b21c;color:#2b2200;font-size:.6rem;font-weight:800;line-height:15px;text-align:center;box-shadow:0 0 0 1.5px #fff;z-index:2}
.u.slow::after{content:"\2193";position:absolute;top:-5px;left:-5px;width:17px;height:17px;border-radius:50%;background:#4a7fd1;color:#fff;font-size:.8rem;font-weight:800;line-height:17px;text-align:center;box-shadow:0 0 0 1.5px #fff}
.u svg{width:90%;height:90%}
.u.done{opacity:.55;filter:saturate(.25) brightness(1.35)}
.hp{position:absolute;left:14%;right:14%;bottom:2%;height:4px;background:rgba(0,0,0,.4);border-radius:2px}
.hp i{display:block;height:100%;background:#f2f2f2;border-radius:2px}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
button.b[aria-pressed=true]{background:var(--you);border-color:var(--you);color:#fff}
button.b:disabled{opacity:.5;cursor:default}
button.b:focus-visible{outline:3px solid var(--you);outline-offset:2px}
button.b small{display:block;font-size:.78rem;opacity:.85}
#pick p{margin:12px 0 4px;font-size:.95rem}
.opts{display:grid;gap:6px}
.hero{text-align:center;padding:28px 0 8px}
.hero p{margin:0;opacity:.85}
.discs{display:flex;justify-content:center;gap:12px}
.pv{position:relative;width:48px;height:48px;flex:none}
.menubtns{display:grid;gap:10px;max-width:280px;margin:22px auto}
button.b.big{text-align:center;font-size:1.05rem;padding:14px}
#prules h3{margin:12px 0 2px;font-size:.95rem}
#prules p{margin:0}
#prules p,#prules h3{text-align:left}
.hd{display:flex;gap:12px;align-items:center}
.hd h2{margin:0;font-size:1.25rem}
.card{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:16px;margin-top:14px}
.card .pv{width:56px;height:56px}
.ec{line-height:1.5}
.ec strong{display:block;font-size:1.05rem;margin-bottom:6px}
.ec .em{font-size:.9rem}
.card small,.cards small,.opts small{display:block;font-size:.78rem;opacity:.85;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#pu .uc:last-child:nth-child(odd){grid-column:1/-1}
button.b.uc{display:flex;flex-direction:row;align-items:center;text-align:left;gap:8px;padding:7px 8px;min-width:0}
button.b.uc .pv{width:34px;height:34px}
.uct{min-width:0;display:grid;gap:1px}
.ucn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.uct small{font-size:.7rem;opacity:.8;line-height:1.25;margin:0}
.utag{justify-self:start;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(224,178,28,.25);margin-top:2px}
.cnt{font-size:.64rem;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--you);color:#fff}
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:4px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--ink);cursor:pointer;padding:0}
.swb[aria-pressed=true]{border-color:var(--panel);box-shadow:0 0 0 4px var(--ink)}
.swb:focus-visible{outline:3px solid var(--you);outline-offset:4px}
#pick h3{margin:18px 0 6px;font-size:1rem}
#pick h3 small{font-weight:400;opacity:.8}
.ov{position:fixed;inset:0;background:rgba(10,15,20,.65);display:grid;place-items:center;padding:16px;z-index:10}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:18px;width:min(340px,100%);display:grid;gap:10px;max-height:90vh;overflow:auto;box-sizing:border-box}
.panel h2{margin:0;text-align:center}
.panel p{margin:0;text-align:center}
.badge{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:8px;font-weight:700;box-shadow:0 0 0 2px var(--ink)}
#fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;font-weight:800;font-size:1.25rem;color:#ff7a66;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px #000;animation:pop 1.1s ease-out forwards;z-index:3;white-space:nowrap}
.pop.miss{color:#ffe08a}
.pop.heal{color:#8dffb0}
.pop.slow{color:#8fc2ff}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-170%) scale(1)}}
@media (prefers-reduced-motion:reduce){@keyframes pop{0%,100%{opacity:0;transform:translate(-50%,-60%)}15%,80%{opacity:1;transform:translate(-50%,-60%)}}}
#info.empty{justify-content:center;opacity:.75}
.nm{display:flex;justify-content:space-between;gap:8px}
.hpb i{display:block;height:100%}
.grp{margin-top:22px}
#pick .grp h3{margin:0 0 8px;font-size:1.05rem}
.sn{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--ink);color:var(--bg);margin-right:8px;font-size:.85rem}
.hint{font-size:.85rem;opacity:.85;margin:8px 0}
.lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:.72rem;text-align:center;min-width:0;box-sizing:border-box}
.slot .pv{width:38px;height:38px}
.slot small{font-size:.66rem;opacity:.8}
.slot.empty{border-style:dashed;opacity:.65;justify-content:center;min-height:84px}
button.slot{cursor:pointer;border-color:var(--you);box-shadow:0 0 0 1px var(--you)}
button.slot:focus-visible{outline:3px solid var(--you);outline-offset:2px}
#pick .go{width:100%;text-align:center;margin-top:20px;font-weight:700;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* ---- visual polish ---- */
html,body{margin:0;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;background:linear-gradient(rgba(128,128,128,.10),rgba(0,0,0,.10)),var(--bg);background-attachment:fixed;min-height:100%}
.hero h1{font-size:2.6rem;margin:10px 0 6px;letter-spacing:.03em;background:linear-gradient(90deg,var(--you),var(--foe));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.discs .pv{width:60px;height:60px;animation:bob 3.2s ease-in-out infinite}
.discs .pv:nth-child(2){animation-delay:.4s}
.discs .pv:nth-child(3){animation-delay:.8s}
.discs .pv:nth-child(4){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
button.b{font:inherit;padding:10px 14px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;text-align:left;box-shadow:0 2px 0 var(--ink);transition:transform .08s,box-shadow .15s}
button.b:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
button.b:not(:disabled):active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.t.ig.ir{background:#8d98a2;box-shadow:inset 0 0 0 4px var(--atk)}
.t.m.pr{box-shadow:inset 0 0 0 4px rgba(226,118,95,.55)}
.t:not(.w):hover{filter:brightness(1.07)}
.dec{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.t.a::after{content:"";position:absolute;inset:6%;border:3px solid rgba(255,255,255,.92);border-radius:50%;z-index:2;pointer-events:none;animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(.92);opacity:.65}}
.u::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.25))}
@keyframes selp{50%{box-shadow:0 0 0 5px var(--ink)}}
.u[data-team=w]{outline:2px dashed rgba(255,255,255,.8);outline-offset:1px}
.card,.panel,#info,#prules{box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* ---- depth ---- */
#bw{position:relative;margin-top:6px}
#board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;background:var(--ink);padding:2px;border-radius:6px;box-shadow:0 7px 0 rgba(0,0,0,.4),0 16px 26px rgba(0,0,0,.35)}
.t.w{background:var(--wall);cursor:default;box-shadow:inset 0 4px 0 rgba(255,255,255,.28),inset 0 -7px 0 rgba(0,0,0,.4)}
.u{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;transform:translateY(-3px);box-shadow:0 3px 0 rgba(0,0,0,.45),0 7px 6px rgba(0,0,0,.3),0 0 0 1.5px rgba(255,255,255,.6)}
.u.sel{box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 0 3px var(--ink);animation:selp 1.4s ease-in-out infinite}
@keyframes selp{50%{box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 0 5px var(--ink)}}
/* ---- terrain guide ---- */
#tguide .panel{width:min(420px,100%)}
#tguide h3{margin:14px 0 0;font-size:1.3rem;text-align:left}
#tguide #tlist h3:first-child{margin-top:0}
#tlist,.tgrid{display:grid;gap:12px}
.tentry{display:grid;gap:4px;text-align:left;background:rgba(128,128,128,.1);border-radius:10px;padding:12px 14px}
.tentry strong{font-size:1.02rem}
.tentry small{display:block;font-size:.85rem;opacity:.9;line-height:1.45}
.tsws{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tsws .tsw{width:100%;height:auto;aspect-ratio:1}
.hli{display:flex;gap:12px;align-items:center;margin-top:8px}
.hli .tsw{width:44px;height:44px;flex:none}
.hli b{font-size:.9rem}
.tsw i.plus{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#2f9e6a;color:#fff;font-style:normal;font-weight:800;font-size:.85rem;line-height:16px;text-align:center}
.tsw{position:relative;width:44px;height:44px;flex:none;border-radius:6px;overflow:hidden;background:var(--tile);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 0 rgba(0,0,0,.3)}
.tsw i.rg{position:absolute;inset:6%;border:3px solid rgba(255,255,255,.92);border-radius:50%}
@media (prefers-reduced-motion:reduce){.discs .pv,.t.a::after,.u.sel{animation:none}}
#tinfo{min-height:64px;margin-top:10px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:8px 12px;display:flex;gap:12px;align-items:center;box-sizing:border-box;font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#tinfo.empty{justify-content:center;opacity:.75}
#info{min-height:88px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-sizing:border-box;font-size:.9rem;margin-top:8px}
.t.ts{outline:2px solid rgba(255,255,255,.85);outline-offset:-3px;filter:brightness(1.1)}
button.b.pri{background:var(--you);border-color:var(--you);color:#fff;font-weight:700;padding:12px 22px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
button.b.sm2{padding:8px 12px;font-size:.85rem}
#tguide{z-index:12}
/* ---- bottom dock ---- */
.turnrow{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.turnrow button.pri{padding:0 24px}
.pb .row{display:flex;gap:12px;align-items:center}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#tomenu{flex:1}
/* highlights on fortress tiles: same colours as other tiles, laid over the art so the castle shows through */
.t.fr>.tint{position:absolute;inset:0;pointer-events:none;opacity:.6}
.t.fr.pr>.tint{background:color-mix(in srgb,var(--atk) 42%,var(--tile))}
.t.fr.m>.tint{background:var(--move)}
.t.fr.ig>.tint{background:#8d98a2}
.t.fr.ir>.tint,.t.fr.a>.tint{background:var(--atk)}
.t.fr.hl>.tint{background:color-mix(in srgb,#4cc38a 55%,var(--tile));box-shadow:inset 0 0 0 4px #2f9e6a;opacity:.75}
.t.fr.m.pr>.tint{box-shadow:inset 0 0 0 4px rgba(226,118,95,.85)}
.t.fr.ig.ir>.tint{background:#8d98a2;box-shadow:inset 0 0 0 4px var(--atk)}
#turn{flex:1;display:flex;align-items:center;min-height:48px;padding:8px 14px;box-sizing:border-box;font-size:1.05rem;font-weight:700;border-radius:8px;background:var(--panel);border:2px solid var(--ink);border-left:8px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15);border-left-width:2px;text-shadow:none}
#info,#tinfo,#info.empty,#tinfo.empty{display:block;opacity:1;min-height:74px;margin-top:6px;padding:6px 10px 8px}
.lbl{letter-spacing:.09em;text-transform:uppercase;opacity:.65;font-weight:700;font-size:.62rem;margin-bottom:3px}
#info .pv{width:38px;height:38px}
#tinfo .tsw{width:40px;height:40px}
.hpb{background:rgba(128,128,128,.35);border-radius:4px;overflow:hidden;height:6px;margin:2px 0}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 2px}
.stat{background:rgba(128,128,128,.18);border-radius:6px;padding:1px 7px;font-size:.74rem}
.ib{flex:1;min-width:0;line-height:1.3}
.ib small{display:block;opacity:.88;font-size:.74rem}
.hprow{display:flex;justify-content:space-between;font-size:.76rem;margin-top:0}
.ph{opacity:.65;text-align:center;font-size:.9rem;padding:8px 0 2px}
/* ---- animation ---- */
.t{aspect-ratio:1;border:0;padding:0;background:var(--tile);position:relative;font:inherit;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 -3px 0 rgba(0,0,0,.14);overflow:visible}
button.b.pri:disabled{background:#8a939c;border-color:#8a939c;color:#e9edf0;opacity:1;box-shadow:none;transform:none}
.u.mv{animation:slide var(--dur,.3s) ease-out;z-index:6}
.u.sel.mv{animation:slide var(--dur,.3s) ease-out,selp 1.4s ease-in-out infinite}
@keyframes slide{from{transform:translate(var(--dx),calc(var(--dy) - 3px))}to{transform:translate(0,-3px)}}
.u.tpin{animation:pin .35s ease-out;z-index:6}
@keyframes pin{from{transform:translateY(-3px) scale(.2);opacity:0}to{transform:translateY(-3px) scale(1);opacity:1}}
.proj{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px rgba(255,220,120,.9),0 0 0 2px rgba(0,0,0,.4);z-index:4;pointer-events:none}
.proj.big{width:18px;height:18px;background:#3a3a3a;box-shadow:0 0 8px 3px rgba(255,150,60,.9),0 0 0 2px #fff}
.burst{position:absolute;width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 12px rgba(255,120,80,.9);z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.u.mv,.u.sel.mv,.u.tpin{animation:none}}
#pbtns{display:grid;gap:10px}
#defeat{z-index:14}
#defeat h2{color:var(--foe)}
.t.pp::before{content:"\2194";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;color:#222;font-size:.72rem;font-weight:700;display:grid;place-items:center;z-index:3;pointer-events:none}
.t.ch{outline:3px solid #fff;outline-offset:-3px}
.t.pd{outline:3px dashed rgba(255,255,255,.95);outline-offset:-4px}
.t.pd::after{content:attr(data-arrow);position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:900;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;z-index:2;pointer-events:none}
.wmap{border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3);background:#d8c99b;margin-top:8px}
.wmap>svg{display:block;width:100%;height:auto}
.wn{cursor:pointer}
.wn:focus-visible circle{stroke:#fff}
#wm{transition:transform .8s ease-in-out;pointer-events:none}
.wp{animation:wpulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wpulse{50%{transform:scale(1.22);opacity:.35}}
#winfo{background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:8px 12px 10px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#winfo .bar{margin-top:8px}
@media (prefers-reduced-motion:reduce){.wp{animation:none}#wm{transition:none}}
.banner{position:absolute;left:50%;top:50%;z-index:9;width:90%;text-align:center;font-weight:800;font-size:clamp(1.3rem,6vw,2rem);color:#fff;-webkit-text-stroke:0;text-shadow:0 0 4px #000,0 2px 6px #000,0 0 14px rgba(0,0,0,.8);pointer-events:none;animation:bn 1.5s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-40%)}15%{opacity:1;transform:translate(-50%,-50%)}55%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pmenu{position:absolute;z-index:8;pointer-events:auto;display:grid;gap:5px;width:140px;padding:7px;background:var(--panel);border:2px solid var(--ink);border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.pmenu button{font:inherit;display:grid;text-align:left;padding:5px 10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;line-height:1.25}
.pmenu button:first-child{background:var(--you);border-color:var(--you);color:#fff}
.pmenu button small{font-size:.7rem;opacity:.85}
.pmenu button small.bd{font-size:.62rem;opacity:.75}
.pmenu button:disabled{opacity:.5;cursor:default}
.pmenu button:focus-visible{outline:3px solid #fff;outline-offset:1px}
.htitle{text-align:center;margin:6px 0 10px}
.hcard{font-size:.9rem;line-height:1.55;background:var(--panel);border-radius:8px;padding:12px 16px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hcard p{margin:0 0 8px;text-align:left}

<script>
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]],pk=k=>k.split(",").map(Number); // the four neighbour steps; "x,y" tile key -> [x,y]
const W=10,H=12,
// hp, mv move, rg/mn range, dmg damage; ar armor, pi pierce, ev evasion (dodge chance); who retaliates: CAN_RETALIATE / CANT_RETALIATE below
TYPES={K:{hp:12,mv:3,rg:1,mn:1,dmg:5,ar:2},A:{hp:8,mv:3,rg:3,mn:1,dmg:4,pi:1,ev:.1},R:{hp:10,mv:2,rg:4,mn:2,dmg:4,pi:2},W:{hp:8,mv:2,rg:1,mn:1,dmg:4,ev:.15},B:{hp:16,mv:1,rg:1,mn:1,dmg:6,ar:1},H:{hp:5,mv:3,rg:2,mn:1,dmg:3,ev:.25},C:{hp:9,mv:5,rg:1,mn:1,dmg:4,ar:1,ev:.1},P:{hp:7,mv:3,rg:2,mn:1,dmg:1,heal:3,ev:.1},E:{hp:6,mv:3,rg:3,mn:1,dmg:2,slow:1,ev:.15},T:{hp:9,mv:3,rg:1,mn:1,dmg:3,ar:1},N:{hp:8,mv:3,rg:1,mn:1,dmg:2,ev:.05},M:{hp:4,mv:2,rg:1,mn:1,dmg:2}};
const LIMIT1="PETN"; // one of each per army
const UNIT_UNLOCK={T:"captain",N:"banner"}; // unlockable units and the unlock each needs
const poolNow=()=>"KARCPE"+Object.keys(UNIT_UNLOCK).filter(t=>unlocks[UNIT_UNLOCK[t]]).join(""); // units an army may pick right now
// Can Retaliate / Can't Retaliate: a unit retaliates when it is in the first list and not in the second (the second wins)
const CAN_RETALIATE="KARCPETNMWBH",CANT_RETALIATE="R";
const canRetaliate=t=>CAN_RETALIATE.includes(t)&&!CANT_RETALIATE.includes(t);
const FOREST_EV=.1,FT_FOREST_EV=.05,EV_CAP=.5,RET_SHARE=.5; // forest dodge bonus (less against Forest Tactics), dodge cap, share of damage dealt when retaliating (always at least 1)
const MUSTER_USES=2,MUSTER_ALIVE=2,BANNER_RANGE=2; // Captain: musters per battle, militia alive at once; Banner Bearer: aura reach
const NAME={K:"knight",A:"archer",R:"artillery",W:"wolf",B:"bear",H:"hawk",C:"cavalry",P:"apothecary",E:"enchanter",T:"captain",N:"banner bearer",M:"militia"};
const MODS={
 TP:{name:"Teleport",desc:"Once per battle, one unit may teleport to any open tile on the far edge (replaces its move)."},
 PUSH:{name:"Push",desc:"Knights may push any unit except artillery and cavalry 2 tiles instead of attacking."},
 FT:{name:"Forest Tactics",desc:"Your units in a forest get +1 armor against ranged attacks. Enemies in a forest only get +5% evasion against your attacks, instead of +10%."},
 PAD:{name:"Padded Armor",desc:"Archers get +1 armor but have 1 less movement."},
 REST:{name:"Field Rest",desc:"At the end of your turn, each of your units that neither moved nor attacked that turn recovers 2 HP."}};
let WALLS=new Set(),FOREST=new Set(),FORT=new Set(),DEEP=new Set(),SHALLOW=new Set();
const UKEY="skirmish_unlocks_v1",unlocks=(()=>{try{return JSON.parse(localStorage.getItem(UKEY)||"{}")||{}}catch(e){return{}}})();
const saveU=()=>{try{localStorage.setItem(UKEY,JSON.stringify(unlocks))}catch(e){}};
const unlock=id=>{if(unlocks[id])return false;unlocks[id]=1;saveU();discover();return true};
function discover(){ // a short "New Discovery!" banner that fades away on whatever screen is showing
  if(document.querySelector(".discovery"))return; // two unlocks at once share one banner
  const d=document.createElement("div");d.className="discovery";d.setAttribute("role","status");
  d.innerHTML="<b>New Discovery!</b>"; // the name stays a surprise until it turns up in battle or the Unlocks menu
  document.body.append(d);setTimeout(()=>d.remove(),3000);
}
const XB_DMG=4; // exploding barrel damage
let BARRELS=new Set(),XBAR=new Set(),bchoice=null,choiceMv=null,lastMove=null; // XBAR: the barrels that explode
let WALLV=0,FORTV=new Map(),FORTK=new Set(); // one wall style per map; each connected fortress group shares one style; FORTK: the tile holding each fortress's keep
const solid=k=>WALLS.has(k)||DEEP.has(k)||BARRELS.has(k);
// Random terrain, mirrored through the map centre so both sides are fair. Start rows stay clear.
function genMap(o={}){
  seed=Math.floor(Math.random()*1e5);
  for(;;){
    const walls=new Set(),forest=new Set(),R=n=>Math.floor(Math.random()*n);
    const deep=new Set(),shal=new Set(),K=(a,b)=>a+","+b,inb=(a,b)=>a>=0&&a<W&&b>=2&&b<=H-3,taken=(a,b)=>deep.has(K(a,b))||shal.has(K(a,b));
    const both=(set,a,b)=>{set.add(K(a,b));set.add(K(W-1-a,H-1-b))};
    const grow=(n,x0,y0)=>{const t=[[x0,y0]];for(let i=0;i<150&&t.length<n;i++){const[bx,by]=t[R(t.length)],[dx,dy]=DIRS[R(4)],nx=bx+dx,ny=by+dy;if(inb(nx,ny)&&!t.some(p=>p[0]===nx&&p[1]===ny))t.push([nx,ny])}return t};
    const shore=(tiles,pd)=>tiles.forEach(([a,b])=>{for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const x=a+dx,y=b+dy;if((dx||dy)&&inb(x,y)&&Math.random()<(dx&&dy?.45:.9))both(shal,x,y)}});
    const blob=(n,isDeep)=>{ // a lake or pond: a deep core ringed by shallows (ponds may be shallow only)
      for(let t=0;t<40;t++){
        const tl=grow(n,1+R(W-2),3+R(H-6)),mir=new Set(tl.map(([a,b])=>K(W-1-a,H-1-b)));
        if(tl.some(([a,b])=>taken(a,b)||mir.has(K(a,b))))continue;
        tl.forEach(([a,b])=>both(isDeep?deep:shal,a,b));if(isDeep)shore(tl);return;
      }
    };
    const river=()=>{ // a winding river from the left edge to the centre, mirrored to the right edge, with a ford on each side
      for(let t=0;t<30;t++){
        let x=0,y=2+R(H-4);const path=[[x,y]],vis=new Set([K(x,y)]);
        for(let s=0;s<40&&!(x===4&&y===5);s++){
          let nx=x,ny=y;
          if(x<4&&Math.random()<.55)nx=x+1;else ny=y+(x===4?(y<5?1:-1):(Math.random()<.5?1:-1));
          if(!inb(nx,ny)||vis.has(K(nx,ny)))continue;
          x=nx;y=ny;vis.add(K(x,y));path.push([x,y]);
        }
        if(!(x===4&&y===5)||path.length>13)continue;
        const cand=path.filter(([a])=>a>=1&&a<=3),ford=cand.length?cand[R(cand.length)]:path[1];
        path.forEach(([a,b])=>{if(a===ford[0]&&b===ford[1])both(shal,a,b);else both(deep,a,b)});
        both(deep,5,5);
        path.forEach(([a,b])=>{DIRS.forEach(([dx,dy])=>{if(inb(a+dx,b+dy)&&Math.random()<.45)both(shal,a+dx,b+dy)})});
        return;
      }
    };
    // Water is not guaranteed (about 45% of maps have none). Otherwise it covers a random 3 tiles up to 2/3 of the map, favouring smaller bodies.
    const wsz=()=>deep.size+shal.size,cap=Math.floor(W*H*2/3);
    const T=o.water?Math.round(24+Math.random()*26):Math.random()<.45?0:Math.round(3+(cap-3)*Math.pow(Math.random(),1.6));
    if(T>0&&T<=5){ // a tiny pond: a few tiles, not mirrored
      const tl=grow(T,1+R(W-2),3+R(H-6));
      tl.forEach(([a,b],i)=>(i===0&&Math.random()<.5&&T>=3?deep:shal).add(K(a,b)));
    }else if(T>5){
      if(T>=26&&Math.random()<.4)river();
      for(let g=0;wsz()<T&&g<60;g++)blob(Math.max(1,Math.min(16,Math.round((T-wsz())/5))),Math.random()<.75);
    }
    if(wsz()>cap)continue;
    deep.forEach(k=>shal.delete(k));
    const free=(a,b)=>a>=0&&a<W&&!walls.has(a+","+b)&&!forest.has(a+","+b)&&!taken(a,b);
    const put=(set,pairs,chunk)=>{
      for(let n=pairs,t=0;n>0&&t++<300;){
        const x=R(W),y=2+R(H-4),tiles=[[x,y]];
        if(chunk&&Math.random()<.5)tiles.push([x+1,y]);
        if(!tiles.every(([a,b])=>free(a,b)&&free(W-1-a,H-1-b)))continue;
        tiles.forEach(([a,b])=>{set.add(a+","+b);set.add((W-1-a)+","+(H-1-b))});n--;
      }
    };
    put(walls,3+R(3),true);put(forest,o.forest||4+R(4),false);
    if(walls.size<5)continue;
    const fort=new Set();
    if(o.fort||Math.random()<.25){ // fortress groupings of 2 to 4 tiles
      const cnt=1+R(2),occ=(a,b)=>walls.has(a+","+b)||forest.has(a+","+b)||fort.has(a+","+b)||taken(a,b);
      const blob=(n,x0,y0)=>{
        const t=[[x0,y0]];
        for(let i=0;i<40&&t.length<n;i++){
          const[bx,by]=t[R(t.length)],[dx,dy]=DIRS[R(4)],nx=bx+dx,ny=by+dy;
          if(nx>=0&&nx<W&&ny>=2&&ny<=H-3&&!t.some(p=>p[0]===nx&&p[1]===ny))t.push([nx,ny]);
        }
        return t.length===n?t:null;
      };
      for(let k=0;k<cnt;k++)for(let tries=0;tries<60;tries++){
        const t=blob(2+R(3),R(W),2+R(H-4));
        if(!t||t.some(([a,b])=>occ(a,b)))continue;
        t.forEach(([a,b])=>fort.add(a+","+b));break;
      }
    }
    const bars=new Set(); // barrels (unlockable): 50% of maps with a fortress get 1-2, each beside a fortress tile
    if(unlocks.barrels&&fort.size&&Math.random()<.5){
      const cand=[];
      fort.forEach(k=>{const[a,b]=pk(k);DIRS.forEach(([dx,dy])=>{const x=a+dx,y=b+dy,kk=K(x,y);if(x>=0&&x<W&&y>=2&&y<=H-3&&!walls.has(kk)&&!forest.has(kk)&&!fort.has(kk)&&!taken(x,y)&&!cand.includes(kk))cand.push(kk)})});
      for(let n=1+R(2);n>0&&cand.length;n--)bars.add(cand.splice(R(cand.length),1)[0]);
    }
    const xbars=new Set(); // exploding barrels (unlockable): each barrel has a 25% chance
    if(unlocks.xbarrels)bars.forEach(k=>{if(Math.random()<.25)xbars.add(k)});
    const seen=new Set(["0,0"]),q=[[0,0]];
    while(q.length){
      const[x,y]=q.pop();
      for(const[dx,dy] of DIRS){
        const nx=x+dx,ny=y+dy,k=nx+","+ny;
        if(nx<0||ny<0||nx>=W||ny>=H||walls.has(k)||deep.has(k)||bars.has(k)||seen.has(k))continue;
        seen.add(k);q.push([nx,ny]);
      }
    }
    if(seen.size===W*H-walls.size-deep.size-bars.size){
      WALLS=walls;FOREST=forest;FORT=fort;DEEP=deep;SHALLOW=shal;BARRELS=bars;XBAR=xbars;WALLV=R(4);FORTV=new Map();FORTK=new Set();
      for(const k0 of fort){
        if(FORTV.has(k0))continue;
        const v=R(2),st=[k0];FORTV.set(k0,v);FORTK.add(k0);
        while(st.length){const[a,b]=pk(st.pop());for(const[dx,dy] of DIRS){const k=(a+dx)+","+(b+dy);if(fort.has(k)&&!FORTV.has(k)){FORTV.set(k,v);st.push(k)}}}
      }
      return;
    }
  }
}
const svg=b=>'<svg class="dec" viewBox="0 0 40 40">'+b+'</svg>';
const tree=(x,y,h,w,c)=>`<rect x="${x-1}" y="${y}" width="2" height="4" fill="#5a3d24"/><path d="M${x} ${y-h}L${x+w} ${y}H${x-w}z" fill="${c}"/>`;
const oak=(x,y,r,c)=>`<rect x="${x-1.2}" y="${y}" width="2.4" height="${r*.8}" fill="#5a3d24"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-r*.3}" cy="${y-r*.3}" r="${r*.45}" fill="rgba(255,255,255,.16)"/>`;
const FOREST_V=[
 svg(tree(32,16,11,5,"#2f6b3f")+tree(20,20,15,6.5,"#3a7d4a")+tree(11,29,17,7,"#2f6b3f")+tree(29,30,19,8,"#245a34")),
 svg(oak(29,14,6.5,"#3f8a4c")+oak(12,18,7,"#2f7a40")+oak(22,28,8,"#4a9a55")),
 svg(tree(14,15,9,4.5,"#3a7d4a")+tree(28,13,9,4.5,"#2f6b3f")+tree(9,27,13,6,"#2f6b3f")+tree(31,28,14,6.5,"#3a7d4a")+tree(20,34,17,7.5,"#245a34")),
 svg(oak(30,9,4,"#b0561f")+oak(12,17,7,"#c07a2a")+oak(28,22,7.5,"#d59a3a")+tree(19,35,14,6,"#2f6b3f"))];
const S1='stroke="rgba(0,0,0,.4)" stroke-width="1.2"';
const WV=(a,c,o)=>svg(`<g fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" opacity="${o}">`+a.map(([x,y])=>`<path d="M${x} ${y}q4-4 8 0t8 0"/>`).join("")+"</g>");

// path cost from every tile to the nearest target, respecting walls; leaving a forest costs +1
function distMap(srcs){
  const D=Array.from({length:H},()=>Array(W).fill(99));
  srcs.forEach(p=>D[p.y][p.x]=0);
  for(let ch=true;ch;){
    ch=false;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      if(solid(x+","+y))continue;
      const c0=1+(FOREST.has(x+","+y)||FORT.has(x+","+y)?1:0);
      for(const[dx,dy] of DIRS){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=W||ny>=H||solid(nx+","+ny))continue;
        const cc=c0+(SHALLOW.has(nx+","+ny)?1:0);
        if(D[ny][nx]+cc<D[y][x]){D[y][x]=D[ny][nx]+cc;ch=true}
      }
    }
  }
  return D;
}

      if(s<p.mS){p.mS=s;p.mB=[x,y]}
    }
    if(mods.f==="TP"&&!tpUsed.f){ // teleport only when it clearly beats walking
      farRow("f").forEach(([x,y])=>{
        const s=evalTile(u,x,y,D,pl,xv)+4;
        if(s<p.s-2){p.s=s;p.best=[x,y];p.tp=true}
        if(s<p.mS-2){p.mS=s;p.mB=[x,y];p.mTp=true}

    }

  }
  function act(u){
    if(g!==gid)return;
    const fin=()=>{u.acted=1;if(!checkEnd())render();later(step,500)};
    const pri=p=>{const c=combat(u,p),kill=c.dmg>=p.hp,r=kill?null:retaliation(u,p);return (kill?100*c.hit:0)+(VAL[p.t]||0)-p.hp*.5-(r?r.hit*r.dmg*2:0)}; // likely kills first, then soft, valuable targets that won't hit back hard
    const ts=targets(u).filter(p=>{const r=dmgTo(u,p)<p.hp&&retaliation(u,p);return !(r&&r.dmg>=u.hp&&r.hit>.5)}).sort((a,b)=>pri(b)-pri(a)); // never trade itself for nothing

    if(hs.length&&(hs[0].hp<=TYPES[hs[0].t].hp-2||!ts.length)){u.acted=1;applyHeal(u,hs[0]);say("Enemy "+NAME[u.t]+" healed an ally.");render();return later(step,600)}
    if(canMuster(u)&&!ts.some(p=>dmgTo(u,p)>=p.hp)){const n=muster(u);say(`Enemy captain mustered ${n} militia.`);render();return later(step,600)} // muster unless a kill is on offer
    // set off an exploding barrel when it beats the best plain attack
    const atkV=ts.length?Math.min(dmgTo(u,ts[0]),ts[0].hp)+(dmgTo(u,ts[0])>=ts[0].hp?8:0)+(VAL[ts[0].t]||0)*.5:0;
    const xb=breakables(u).filter(k=>XBAR.has(k)).map(k=>[k,blastValue(k)]).sort((a,b)=>b[1]-a[1])[0];
    if(xb&&xb[1]>=4&&xb[1]>atkV){
      const[bx,by]=pk(xb[0]);u.acted=1;

    }

      const sl=ts.filter(p=>!p.slow&&mvOf(p)>1).sort((a,b)=>TYPES[b.t].dmg-TYPES[a.t].dmg||TYPES[b.t].mv-TYPES[a.t].mv)[0];
      if(sl){u.acted=1;animAttack(u,sl,()=>{sl.slow=1;floatText(sl.x,sl.y,"Slow","slow");say("Enemy "+NAME[u.t]+" slowed your "+NAME[sl.t]+".");fin()});return}
    }
    if(ts.length){
      u.acted=1;
      let pushed=false;
      if(mods.f==="PUSH"&&u.t==="K"){ // push a survivor into a forest to slow it down
        const c=ts.find(p=>pushable(u,p)&&dmgTo(u,p)<p.hp&&FOREST.has(pushDest(u,p)+"")&&pushDest(u,p)+""!==p.x+","+p.y);
        if(c){[c.x,c.y]=pushDest(u,c);pushed=true;say("Enemy knight pushed your "+NAME[c.t]+" into a forest.")}
      }
      if(!pushed){attack(u,ts[0],fin);return}
    }
    fin();
  }
  function step(){
    if(over||g!==gid)return;
    const left=units.filter(u=>u.team==="f"&&!done.has(u)&&!u.acted); // militia mustered this turn wait until next turn
    if(left.length){

      const pl=units.filter(p=>p.team==="y"),D=distMap(pl),xv=blastPlan(),plans=left.map(u=>planFor(u,pl,D,xv));

      [u.x,u.y]=dest;render();
      later(()=>act(u),350);
      return;
    }
    if(wi<wq.length){
      const u=wq[wi++];
      if(!units.includes(u))return step();
      if(Math.random()<.6){ // wander to a random reachable tile; never chases anyone
        const opts=reach(u).map(k=>pk(k));
        if(opts.length){[u.x,u.y]=opts[Math.floor(Math.random()*opts.length)];render()}
      }
      later(()=>{
        if(g!==gid)return;
        const ts=targets(u).sort((a,b)=>a.hp-b.hp);
        if(!ts.length)return step();
        attack(u,ts[0],()=>{if(!checkEnd())render();later(step,500)});
      },350);
      return;
    }
    const healed=mods.f==="REST"?rest("f"):0;
    units.forEach(u=>{u.moved=u.acted=0;if(u.team!=="y")delete u.slow});
    turn="y";busy=false;say("Your turn. Select one of your units."+(healed?" Resting enemy units recovered HP.":""));render();notify("Enemy turn ended — your move");
  }
  step();
}

}
